<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" fill="none">
  <defs>
    <style>
      :root {
        --bg-grad-start: #f8fafc;
        --bg-grad-end: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --grid-line: rgba(15, 23, 42, 0.04);
        --accent: #0284c7;
        --emerald: #059669;
        --purple: #7c3aed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-grad-start: #090d16;
          --bg-grad-end: #0f172a;
          --card-bg: rgba(15, 23, 42, 0.9);
          --text-primary: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #1e293b;
          --grid-line: rgba(255, 255, 255, 0.04);
          --accent: #06b6d4;
          --emerald: #10b981;
          --purple: #a855f7;
        }
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-grad-start)" />
      <stop offset="100%" stop-color="var(--bg-grad-end)" />
    </linearGradient>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--grid-line)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad)" stroke="var(--border-color)" stroke-width="1.5" />
  <rect width="800" height="360" rx="16" fill="url(#techGrid)" />

  <!-- Left Content -->
  <g transform="translate(60, 70)">
    <rect width="180" height="26" rx="13" fill="var(--card-bg)" stroke="var(--purple)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="var(--purple)" />
    <text x="26" y="17" fill="var(--purple)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TAXONOMY NETWORK</text>

    <text x="0" y="65" fill="var(--text-primary)" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
      SkillGraph Knowledge Network
    </text>

    <text x="0" y="98" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      Relational knowledge graph mapping grounded AST constructs and
    </text>
    <text x="0" y="118" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      dependencies to Skills, Technologies, and Engineering Concepts.
    </text>

    <g transform="translate(0, 150)">
      <rect width="130" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">3-TIER MODEL</text>
      <text x="12" y="34" fill="var(--purple)" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Skill · Tech · Concept</text>
    </g>
  </g>

  <!-- Right Visual: Graph Nodes -->
  <g transform="translate(560, 170)">
    <line x1="-70" y1="-50" x2="0" y2="0" stroke="var(--border-color)" stroke-width="1.5" />
    <line x1="70" y1="-50" x2="0" y2="0" stroke="var(--border-color)" stroke-width="1.5" />
    <line x1="-70" y1="50" x2="0" y2="0" stroke="var(--border-color)" stroke-width="1.5" />
    <line x1="70" y1="50" x2="0" y2="0" stroke="var(--border-color)" stroke-width="1.5" />

    <!-- Center Skill -->
    <ellipse cx="0" cy="0" rx="42" ry="20" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="2" />
    <text x="0" y="4" text-anchor="middle" fill="var(--accent)" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Skill</text>

    <!-- Technologies -->
    <rect x="-105" y="-64" width="70" height="28" rx="5" fill="var(--card-bg)" stroke="var(--emerald)" stroke-width="1.5" />
    <text x="-70" y="-46" text-anchor="middle" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="9" font-weight="600">FastAPI</text>

    <rect x="35" y="-64" width="70" height="28" rx="5" fill="var(--card-bg)" stroke="var(--emerald)" stroke-width="1.5" />
    <text x="70" y="-46" text-anchor="middle" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="9" font-weight="600">Postgres</text>

    <!-- Concepts -->
    <polygon points="-70,35 -40,50 -70,65 -100,50" fill="var(--card-bg)" stroke="var(--purple)" stroke-width="1.5" />
    <text x="-70" y="53" text-anchor="middle" fill="var(--purple)" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Async</text>

    <polygon points="70,35 100,50 70,65 40,50" fill="var(--card-bg)" stroke="var(--purple)" stroke-width="1.5" />
    <text x="70" y="53" text-anchor="middle" fill="var(--purple)" font-family="system-ui, sans-serif" font-size="8" font-weight="600">ORM</text>
  </g>
</svg>

