<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" fill="none">
  <defs>
    <style>
      :root {
        --bg-grad-start: #f8fafc;
        --bg-grad-end: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --grid-line: rgba(15, 23, 42, 0.04);
        --accent: #0284c7;
        --emerald: #059669;
        --purple: #7c3aed;
        --amber: #d97706;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-grad-start: #090d16;
          --bg-grad-end: #0f172a;
          --card-bg: rgba(15, 23, 42, 0.9);
          --text-primary: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #1e293b;
          --grid-line: rgba(255, 255, 255, 0.04);
          --accent: #06b6d4;
          --emerald: #10b981;
          --purple: #a855f7;
          --amber: #f59e0b;
        }
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-grad-start)" />
      <stop offset="100%" stop-color="var(--bg-grad-end)" />
    </linearGradient>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--grid-line)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad)" stroke="var(--border-color)" stroke-width="1.5" />
  <rect width="800" height="360" rx="16" fill="url(#techGrid)" />

  <!-- Left Content -->
  <g transform="translate(60, 70)">
    <rect width="210" height="26" rx="13" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="var(--accent)" />
    <text x="26" y="17" fill="var(--accent)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CAPABILITY INTELLIGENCE LOOP</text>

    <text x="0" y="65" fill="var(--text-primary)" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
      An Evolving Picture Of Code
    </text>

    <text x="0" y="98" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      DevTwin connects what you know, how you actually build, and
    </text>
    <text x="0" y="118" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      how your engineering maturity evolves over time from verifiable code.
    </text>

    <g transform="translate(0, 150)">
      <rect width="260" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">TECHNICAL INTELLIGENCE LOOP</text>
      <text x="12" y="34" fill="var(--accent)" font-family="ui-monospace, monospace" font-size="11" font-weight="700">KNOW → BUILD → DETECT → SCORE</text>
    </g>
  </g>

  <!-- Right Visual: Intelligence Loop -->
  <g transform="translate(580, 180)">
    <circle cx="0" cy="0" r="90" stroke="var(--border-color)" stroke-width="2" stroke-dasharray="6 4" />
    
    <circle cx="0" cy="-90" r="16" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="2" />
    <text x="0" y="-86" text-anchor="middle" fill="var(--accent)" font-family="ui-monospace, monospace" font-size="8" font-weight="700">KNOW</text>

    <circle cx="78" cy="-45" r="16" fill="var(--card-bg)" stroke="var(--emerald)" stroke-width="2" />
    <text x="78" y="-41" text-anchor="middle" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="8" font-weight="700">BUILD</text>

    <circle cx="78" cy="45" r="16" fill="var(--card-bg)" stroke="var(--amber)" stroke-width="2" />
    <text x="78" y="49" text-anchor="middle" fill="var(--amber)" font-family="ui-monospace, monospace" font-size="8" font-weight="700">DETECT</text>

    <circle cx="0" cy="90" r="16" fill="var(--card-bg)" stroke="var(--purple)" stroke-width="2" />
    <text x="0" y="94" text-anchor="middle" fill="var(--purple)" font-family="ui-monospace, monospace" font-size="8" font-weight="700">LEARN</text>

    <circle cx="-78" cy="45" r="16" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="2" />
    <text x="-78" y="49" text-anchor="middle" fill="var(--accent)" font-family="ui-monospace, monospace" font-size="8" font-weight="700">IMPROV</text>

    <circle cx="-78" cy="-45" r="16" fill="var(--card-bg)" stroke="var(--emerald)" stroke-width="2" />
    <text x="-78" y="-41" text-anchor="middle" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="8" font-weight="700">EVAL</text>

    <!-- Center -->
    <circle cx="0" cy="0" r="26" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="2.5" />
    <text x="0" y="4" text-anchor="middle" fill="var(--accent)" font-family="system-ui, sans-serif" font-size="9" font-weight="800">TWIN</text>
  </g>
</svg>

