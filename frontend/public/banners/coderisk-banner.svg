<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" fill="none">
  <defs>
    <style>
      :root {
        --bg-grad-start: #f8fafc;
        --bg-grad-end: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --grid-line: rgba(15, 23, 42, 0.04);
        --accent: #0284c7;
        --rose: #e11d48;
        --amber: #d97706;
        --emerald: #059669;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-grad-start: #090d16;
          --bg-grad-end: #0f172a;
          --card-bg: rgba(15, 23, 42, 0.9);
          --text-primary: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #1e293b;
          --grid-line: rgba(255, 255, 255, 0.04);
          --accent: #06b6d4;
          --rose: #f43f5e;
          --amber: #f59e0b;
          --emerald: #10b981;
        }
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-grad-start)" />
      <stop offset="100%" stop-color="var(--bg-grad-end)" />
    </linearGradient>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--grid-line)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad)" stroke="var(--border-color)" stroke-width="1.5" />
  <rect width="800" height="360" rx="16" fill="url(#techGrid)" />

  <!-- Left Content -->
  <g transform="translate(60, 70)">
    <rect width="180" height="26" rx="13" fill="var(--card-bg)" stroke="var(--rose)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="var(--rose)" />
    <text x="26" y="17" fill="var(--rose)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATIC RISK ENGINE</text>

    <text x="0" y="65" fill="var(--text-primary)" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
      CodeRisk Intelligence
    </text>

    <text x="0" y="98" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      Deterministic static analysis heuristics across security, reliability,
    </text>
    <text x="0" y="118" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      maintainability, and testing — with verified secret redaction.
    </text>

    <g transform="translate(0, 150)">
      <rect width="190" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">CORE PRINCIPLE</text>
      <text x="12" y="34" fill="var(--amber)" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Risk ≠ Competence</text>
    </g>
  </g>

  <!-- Right Visual: Shield Matrix -->
  <g transform="translate(580, 160)">
    <path d="M 0 -80 L 75 -50 C 75 35 0 95 0 95 C 0 95 -75 35 -75 -50 Z" fill="none" stroke="var(--accent)" stroke-width="2.5" />
    <line x1="0" y1="-75" x2="0" y2="90" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="-65" y1="-5" x2="65" y2="-5" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="3 3" />

    <text x="-32" y="-22" text-anchor="middle" fill="var(--rose)" font-family="ui-monospace, monospace" font-size="11" font-weight="700">SEC</text>
    <text x="32" y="-22" text-anchor="middle" fill="var(--amber)" font-family="ui-monospace, monospace" font-size="11" font-weight="700">REL</text>
    <text x="-32" y="32" text-anchor="middle" fill="var(--accent)" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MAINT</text>
    <text x="32" y="32" text-anchor="middle" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="11" font-weight="700">TEST</text>
  </g>
</svg>

