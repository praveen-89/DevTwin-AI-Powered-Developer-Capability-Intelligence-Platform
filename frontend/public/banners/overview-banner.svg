<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" fill="none">
  <defs>
    <style>
      :root {
        --bg-grad-start: #f8fafc;
        --bg-grad-end: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --grid-line: rgba(15, 23, 42, 0.04);
        --accent: #0284c7;
        --emerald: #059669;
        --purple: #7c3aed;
        --amber: #d97706;
        --core-glow: rgba(2, 132, 199, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-grad-start: #090d16;
          --bg-grad-end: #0f172a;
          --card-bg: rgba(15, 23, 42, 0.9);
          --text-primary: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #1e293b;
          --grid-line: rgba(255, 255, 255, 0.04);
          --accent: #06b6d4;
          --emerald: #10b981;
          --purple: #a855f7;
          --amber: #f59e0b;
          --core-glow: rgba(6, 182, 212, 0.25);
        }
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-grad-start)" />
      <stop offset="100%" stop-color="var(--bg-grad-end)" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--core-glow)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--grid-line)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="16" fill="url(#bgGrad)" stroke="var(--border-color)" stroke-width="1.5" />
  <rect width="800" height="360" rx="16" fill="url(#techGrid)" />
  <circle cx="560" cy="180" r="150" fill="url(#centerGlow)" />

  <!-- Left Content: Hero Text -->
  <g transform="translate(60, 70)">
    <!-- Pill Badge -->
    <rect width="180" height="26" rx="13" fill="var(--core-glow)" stroke="var(--accent)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="var(--accent)" />
    <text x="26" y="17" fill="var(--accent)" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">DEVELOPER DIGITAL TWIN</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="var(--text-primary)" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
      Capability Intelligence Overview
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="var(--text-muted)" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
      Real-time capability index, active repository pipeline telemetry,
    </text>
    <text x="0" y="118" fill="var(--text-muted)" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
      and verifiable evidence progression from your actual commits.
    </text>

    <!-- Key Metrics Badges -->
    <g transform="translate(0, 150)">
      <rect width="95" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SCORE</text>
      <text x="12" y="34" fill="var(--accent)" font-family="ui-monospace, monospace" font-size="15" font-weight="700">0.84</text>
    </g>
    <g transform="translate(108, 150)">
      <rect width="115" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">CONFIDENCE</text>
      <text x="12" y="34" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="15" font-weight="700">0.92 (92%)</text>
    </g>
    <g transform="translate(236, 150)">
      <rect width="105" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">EVIDENCE</text>
      <text x="12" y="34" fill="var(--purple)" font-family="ui-monospace, monospace" font-size="15" font-weight="700">86 Items</text>
    </g>
  </g>

  <!-- Right Visual: Digital Twin Pulse Radar -->
  <g transform="translate(560, 180)">
    <circle cx="0" cy="0" r="110" stroke="var(--border-color)" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="75" stroke="var(--accent)" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="40" stroke="var(--border-color)" stroke-width="1" />

    <!-- Node Lines -->
    <line x1="0" y1="0" x2="-80" y2="-60" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <line x1="0" y1="0" x2="80" y2="-60" stroke="var(--emerald)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <line x1="0" y1="0" x2="-80" y2="70" stroke="var(--purple)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <line x1="0" y1="0" x2="80" y2="70" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Central Twin Node -->
    <circle cx="0" cy="0" r="26" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="3" />
    <circle cx="0" cy="0" r="16" fill="var(--accent)" opacity="0.8" />
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="9" font-weight="800">TWIN</text>

    <!-- Node Pins -->
    <circle cx="-80" cy="-60" r="7" fill="var(--accent)" stroke="var(--card-bg)" stroke-width="2" />
    <circle cx="80" cy="-60" r="7" fill="var(--emerald)" stroke="var(--card-bg)" stroke-width="2" />
    <circle cx="-80" cy="70" r="7" fill="var(--purple)" stroke="var(--card-bg)" stroke-width="2" />
    <circle cx="80" cy="70" r="7" fill="var(--amber)" stroke="var(--card-bg)" stroke-width="2" />
  </g>
</svg>

