<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" fill="none">
  <defs>
    <style>
      :root {
        --bg-grad-start: #f8fafc;
        --bg-grad-end: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --grid-line: rgba(15, 23, 42, 0.04);
        --accent: #0284c7;
        --emerald: #059669;
        --purple: #7c3aed;
        --amber: #d97706;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-grad-start: #090d16;
          --bg-grad-end: #0f172a;
          --card-bg: rgba(15, 23, 42, 0.9);
          --text-primary: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #1e293b;
          --grid-line: rgba(255, 255, 255, 0.04);
          --accent: #06b6d4;
          --emerald: #10b981;
          --purple: #a855f7;
          --amber: #f59e0b;
        }
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-grad-start)" />
      <stop offset="100%" stop-color="var(--bg-grad-end)" />
    </linearGradient>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--grid-line)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad)" stroke="var(--border-color)" stroke-width="1.5" />
  <rect width="800" height="360" rx="16" fill="url(#techGrid)" />

  <!-- Left Content -->
  <g transform="translate(60, 70)">
    <rect width="185" height="26" rx="13" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="var(--accent)" />
    <text x="26" y="17" fill="var(--accent)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SOURCE CODE INGESTION</text>

    <text x="0" y="65" fill="var(--text-primary)" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
      Repository Scanning Fleet
    </text>

    <text x="0" y="98" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      Secure repository extraction, Git commit topology tracking,
    </text>
    <text x="0" y="118" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      and automated multi-language AST syntax tree parsing.
    </text>

    <g transform="translate(0, 150)">
      <rect width="120" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">INGESTION</text>
      <text x="12" y="34" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="14" font-weight="700">Safe Tarball</text>
    </g>
    <g transform="translate(132, 150)">
      <rect width="110" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">PARSERS</text>
      <text x="12" y="34" fill="var(--accent)" font-family="ui-monospace, monospace" font-size="14" font-weight="700">AST + Manifest</text>
    </g>
  </g>

  <!-- Right Visual: Git Branch Diagram -->
  <g transform="translate(480, 130)">
    <path d="M 0 50 L 250 50" stroke="var(--border-color)" stroke-width="3" />
    <path d="M 50 50 C 80 50 90 0 130 0 L 230 0" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="5 3" />
    <path d="M 90 50 C 120 50 130 100 170 100 L 250 100" stroke="var(--purple)" stroke-width="2.5" />

    <circle cx="20" cy="50" r="7" fill="var(--card-bg)" stroke="var(--text-muted)" stroke-width="2.5" />
    <circle cx="70" cy="50" r="7" fill="var(--accent)" stroke="var(--card-bg)" stroke-width="2" />
    <circle cx="150" cy="0" r="6" fill="var(--accent)" stroke="var(--card-bg)" stroke-width="2" />
    <circle cx="190" cy="100" r="6" fill="var(--purple)" stroke="var(--card-bg)" stroke-width="2" />
    <circle cx="210" cy="50" r="9" fill="var(--emerald)" stroke="var(--card-bg)" stroke-width="2" />
  </g>
</svg>

