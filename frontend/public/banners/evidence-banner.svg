<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" fill="none">
  <defs>
    <style>
      :root {
        --bg-grad-start: #f8fafc;
        --bg-grad-end: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --grid-line: rgba(15, 23, 42, 0.04);
        --accent: #0284c7;
        --emerald: #059669;
        --purple: #7c3aed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-grad-start: #090d16;
          --bg-grad-end: #0f172a;
          --card-bg: rgba(15, 23, 42, 0.9);
          --text-primary: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #1e293b;
          --grid-line: rgba(255, 255, 255, 0.04);
          --accent: #06b6d4;
          --emerald: #10b981;
          --purple: #a855f7;
        }
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-grad-start)" />
      <stop offset="100%" stop-color="var(--bg-grad-end)" />
    </linearGradient>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--grid-line)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad)" stroke="var(--border-color)" stroke-width="1.5" />
  <rect width="800" height="360" rx="16" fill="url(#techGrid)" />

  <!-- Left Content -->
  <g transform="translate(60, 70)">
    <rect width="180" height="26" rx="13" fill="var(--card-bg)" stroke="var(--emerald)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="var(--emerald)" />
    <text x="26" y="17" fill="var(--emerald)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">EVIDENCE EXPLORER</text>

    <text x="0" y="65" fill="var(--text-primary)" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
      Verifiable Code Provenance
    </text>

    <text x="0" y="98" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      Contextualized observations with strength, directness, reliability,
    </text>
    <text x="0" y="118" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      and polarity weights backed by exact repository file and line locations.
    </text>

    <g transform="translate(0, 150)">
      <rect width="150" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">GROUND TRUTH</text>
      <text x="12" y="34" fill="var(--emerald)" font-family="system-ui, sans-serif" font-size="12" font-weight="700">100% Provenance</text>
    </g>
  </g>

  <!-- Right Visual: Layered Evidence Cards -->
  <g transform="translate(480, 100)">
    <rect x="20" y="0" width="220" height="48" rx="6" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
    <text x="32" y="20" fill="var(--text-muted)" font-family="ui-monospace, monospace" font-size="9">DEPENDENCY_FOUND: fastapi</text>
    <text x="32" y="36" fill="var(--accent)" font-family="ui-monospace, monospace" font-size="10" font-weight="600">MENTION (Strength: 0.20)</text>

    <rect x="10" y="55" width="230" height="52" rx="6" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
    <text x="22" y="75" fill="var(--text-muted)" font-family="ui-monospace, monospace" font-size="9">MODULE_IMPORTED: sqlalchemy</text>
    <text x="22" y="92" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="10" font-weight="600">USAGE (Strength: 0.50)</text>

    <rect x="0" y="115" width="240" height="56" rx="6" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="1.5" />
    <text x="12" y="135" fill="var(--text-muted)" font-family="ui-monospace, monospace" font-size="9">CLASS_DEFINED: PipelineRunner</text>
    <text x="12" y="153" fill="var(--text-primary)" font-family="ui-monospace, monospace" font-size="10" font-weight="700">APPLIED_ENG (S=0.80, P=+1.0)</text>
  </g>
</svg>

