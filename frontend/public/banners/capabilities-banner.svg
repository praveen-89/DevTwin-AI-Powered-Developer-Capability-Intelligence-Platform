<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" fill="none">
  <defs>
    <style>
      :root {
        --bg-grad-start: #f8fafc;
        --bg-grad-end: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --grid-line: rgba(15, 23, 42, 0.04);
        --accent: #0284c7;
        --emerald: #059669;
        --purple: #7c3aed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-grad-start: #090d16;
          --bg-grad-end: #0f172a;
          --card-bg: rgba(15, 23, 42, 0.9);
          --text-primary: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #1e293b;
          --grid-line: rgba(255, 255, 255, 0.04);
          --accent: #06b6d4;
          --emerald: #10b981;
          --purple: #a855f7;
        }
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-grad-start)" />
      <stop offset="100%" stop-color="var(--bg-grad-end)" />
    </linearGradient>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--grid-line)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad)" stroke="var(--border-color)" stroke-width="1.5" />
  <rect width="800" height="360" rx="16" fill="url(#techGrid)" />

  <!-- Left Content -->
  <g transform="translate(60, 70)">
    <rect width="180" height="26" rx="13" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="var(--accent)" />
    <text x="26" y="17" fill="var(--accent)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SCORING ENGINE V1</text>

    <text x="0" y="65" fill="var(--text-primary)" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
      Capability Scoring &amp; Growth
    </text>

    <text x="0" y="98" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      Deterministic sigmoid mathematical aggregation, diminishing returns,
    </text>
    <text x="0" y="118" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      and half-life temporal decay over an append-only snapshot history.
    </text>

    <g transform="translate(0, 150)">
      <rect width="210" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SIGMOID FORMULA</text>
      <text x="12" y="34" fill="var(--accent)" font-family="ui-monospace, monospace" font-size="12" font-weight="700">clamp(σ(Σw/3.0), 0.01, 0.99)</text>
    </g>
  </g>

  <!-- Right Visual: Sigmoid Curve -->
  <g transform="translate(480, 80)">
    <line x1="0" y1="160" x2="240" y2="160" stroke="var(--border-color)" stroke-width="1.5" />
    <line x1="0" y1="160" x2="0" y2="10" stroke="var(--border-color)" stroke-width="1.5" />
    <path d="M 0 150 Q 80 145 120 85 T 230 30" stroke="var(--accent)" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <circle cx="120" cy="85" r="5" fill="var(--emerald)" stroke="var(--card-bg)" stroke-width="2" />
    <circle cx="200" cy="40" r="5" fill="var(--accent)" stroke="var(--card-bg)" stroke-width="2" />
  </g>
</svg>

