<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" fill="none">
  <defs>
    <style>
      :root {
        --bg-grad-start: #f8fafc;
        --bg-grad-end: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --grid-line: rgba(15, 23, 42, 0.04);
        --accent: #0284c7;
        --emerald: #059669;
        --purple: #7c3aed;
        --rose: #e11d48;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-grad-start: #090d16;
          --bg-grad-end: #0f172a;
          --card-bg: rgba(15, 23, 42, 0.9);
          --text-primary: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #1e293b;
          --grid-line: rgba(255, 255, 255, 0.04);
          --accent: #06b6d4;
          --emerald: #10b981;
          --purple: #a855f7;
          --rose: #f43f5e;
        }
      }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-grad-start)" />
      <stop offset="100%" stop-color="var(--bg-grad-end)" />
    </linearGradient>
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="var(--grid-line)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad)" stroke="var(--border-color)" stroke-width="1.5" />
  <rect width="800" height="360" rx="16" fill="url(#techGrid)" />

  <!-- Left Content -->
  <g transform="translate(60, 70)">
    <rect width="165" height="26" rx="13" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="var(--accent)" />
    <text x="26" y="17" fill="var(--accent)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PROJECT MISSION</text>

    <text x="0" y="65" fill="var(--text-primary)" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
      About DevTwin
    </text>

    <text x="0" y="98" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      An AI-powered Developer Capability Intelligence Platform replacing
    </text>
    <text x="0" y="118" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="14">
      unverified resumes with continuous, evidence-backed engineering ground truth.
    </text>

    <g transform="translate(0, 150)">
      <rect width="170" height="42" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
      <text x="12" y="17" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">ARCHITECTURE</text>
      <text x="12" y="34" fill="var(--accent)" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Evidence-Backed MVP</text>
    </g>
  </g>

  <!-- Right Visual: Comparison Matrix -->
  <g transform="translate(480, 80)">
    <!-- Static Resume Card -->
    <rect x="0" y="10" width="120" height="150" rx="8" fill="var(--card-bg)" stroke="var(--border-color)" stroke-width="1" />
    <text x="60" y="32" text-anchor="middle" fill="var(--text-muted)" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STATIC RESUME</text>
    <line x1="20" y1="50" x2="100" y2="50" stroke="var(--border-color)" stroke-width="1" />
    <line x1="20" y1="70" x2="85" y2="70" stroke="var(--border-color)" stroke-width="1" />
    <line x1="20" y1="90" x2="95" y2="90" stroke="var(--border-color)" stroke-width="1" />
    <text x="60" y="135" text-anchor="middle" fill="var(--rose)" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Unverified Claims</text>

    <!-- DevTwin Evidence Card -->
    <rect x="140" y="10" width="130" height="150" rx="8" fill="var(--card-bg)" stroke="var(--accent)" stroke-width="2" />
    <text x="205" y="32" text-anchor="middle" fill="var(--accent)" font-family="system-ui, sans-serif" font-size="10" font-weight="700">DEVTWIN</text>
    <text x="155" y="58" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="9">✓ AST Verified</text>
    <text x="155" y="78" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="9">✓ Git Provenance</text>
    <text x="155" y="98" fill="var(--emerald)" font-family="ui-monospace, monospace" font-size="9">✓ Risk Signals</text>
    <text x="205" y="135" text-anchor="middle" fill="var(--emerald)" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Ground Truth</text>
  </g>
</svg>

